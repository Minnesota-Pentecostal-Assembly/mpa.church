# Deploys the site to GitHub Pages.
# Two jobs, as GitHub recommends: "build" prepares and uploads the site, then "deploy" publishes it.
# (With both in one job, GitHub sometimes reports "No artifacts named github-pages were found"
#  because its artifact list has not caught up with the upload yet.)
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  # (the "Update blog, video and events" task also starts it after committing changes)
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Lock the QR code page
        # Encrypts the staff QR code generator with the QR_PAGE_PASSWORD secret (see .github/scripts/encrypt_qr.mjs)
        env:
          QR_PAGE_PASSWORD: ${{ secrets.QR_PAGE_PASSWORD }}
        run: node .github/scripts/encrypt_qr.mjs
      - name: Update sitemap
        run: python .github/scripts/make_sitemap.py
      - name: Build header and footer into pages
        run: python .github/scripts/inline_partials.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository (dot-folders such as .github are left out)
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
