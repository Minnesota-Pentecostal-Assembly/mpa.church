# Refreshes the "Recent news" list on leadership.html from Pastor Tinku's blog feed
# at 9 AM and 9 PM Minnesota time (America/Chicago), every day.
#
# GitHub schedules run on UTC, which does not change for daylight saving time.
# So there are two sets of times below, one for summer (CDT) and one for winter (CST).
# The "Check local time" step lets only the set that matches the current season run.
# You can also run it any time from the Actions tab > Update blog posts > Run workflow.

name: Update blog posts

on:
  schedule:
    # Summer (CDT, UTC-5): 9 AM = 14:00 UTC, 9 PM = 02:00 UTC
    - cron: "0 14,2 * * *"
    # Winter (CST, UTC-6): 9 AM = 15:00 UTC, 9 PM = 03:00 UTC
    - cron: "0 15,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check local time
        id: season
        run: |
          offset=$(TZ=America/Chicago date +%z)
          run=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$offset" = "-0500" ] && [ "${{ github.event.schedule }}" != "0 14,2 * * *" ]; then run=no; fi
            if [ "$offset" = "-0600" ] && [ "${{ github.event.schedule }}" != "0 15,3 * * *" ]; then run=no; fi
          fi
          echo "Chicago offset $offset, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.season.outputs.run == 'yes'

      - name: Fetch latest posts
        if: steps.season.outputs.run == 'yes'
        run: python3 .github/scripts/update_blog.py

      - name: Commit if changed
        if: steps.season.outputs.run == 'yes'
        run: |
          if git diff --quiet -- leadership.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add leadership.html
          git commit -m "Update blog posts from feed"
          git push
