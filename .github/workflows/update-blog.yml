# Refreshes the "Recent news" list on leadership.html from Pastor Tinku's blog feed,
# the latest YouTube video on the homepage (index.html, when that section is on the page),
# and the Upcoming events list on events.html from the Planning Center calendar,
# at 9 AM and 9 PM Minnesota time (America/Chicago), every day.
#
# GitHub schedules run on UTC, which does not change for daylight saving time.
# So there are two sets of times below, one for summer (CDT) and one for winter (CST).
# The "Check local time" step lets only the set that matches the current season run.
# You can also run it any time from the Actions tab > Update blog, video and events > Run workflow.

name: Update blog, video and events

on:
  schedule:
    # Summer (CDT, UTC-5): 9 AM = 14:00 UTC, 9 PM = 02:00 UTC
    - cron: "0 14,2 * * *"
    # Winter (CST, UTC-6): 9 AM = 15:00 UTC, 9 PM = 03:00 UTC
    - cron: "0 15,3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets this task start the "Deploy static content to Pages" workflow

concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check local time
        id: season
        run: |
          offset=$(TZ=America/Chicago date +%z)
          run=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$offset" = "-0500" ] && [ "${{ github.event.schedule }}" != "0 14,2 * * *" ]; then run=no; fi
            if [ "$offset" = "-0600" ] && [ "${{ github.event.schedule }}" != "0 15,3 * * *" ]; then run=no; fi
          fi
          echo "Chicago offset $offset, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.season.outputs.run == 'yes'

      # Its own Python, so installing the calendar tools works on any Ubuntu version.
      - uses: actions/setup-python@v6
        if: steps.season.outputs.run == 'yes'
        with:
          python-version: "3.15"

      - name: Fetch latest posts
        if: steps.season.outputs.run == 'yes'
        run: python .github/scripts/update_blog.py

      - name: Fetch latest YouTube video
        if: steps.season.outputs.run == 'yes'
        run: python .github/scripts/update_sermon.py

      - name: Install calendar tools
        if: steps.season.outputs.run == 'yes'
        run: python -m pip install --quiet icalendar recurring_ical_events

      - name: Fetch upcoming events
        if: steps.season.outputs.run == 'yes'
        env:
          PCO_ICAL_URL: ${{ secrets.PCO_ICAL_URL }}
        run: python .github/scripts/update_events.py

      - name: Commit if changed
        if: steps.season.outputs.run == 'yes'
        run: |
          if git diff --quiet -- leadership.html index.html events.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add leadership.html index.html events.html
          git commit -m "Update blog, video and events from feeds"
          git push
          # Commits made by this task don't start other workflows on their own,
          # so ask the Pages workflow (.github/workflows/static.yml) to publish the update.
          gh workflow run static.yml --ref "${{ github.ref_name }}" || echo "Could not start static.yml; run 'Deploy static content to Pages' manually."
        env:
          GH_TOKEN: ${{ github.token }}
